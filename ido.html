<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Unix Timestamp</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    #timestamp {
      font-size: 2em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Aktuális Unix Timestamp</h1>
  <div id="timestamp">Betöltés...</div>

  <script>
    function updateTimestamp() {
      const now = Math.floor(Date.now() / 1000);
      document.getElementById('timestamp').textContent = now;
    }

    updateTimestamp();
    setInterval(updateTimestamp, 1000);
  </script>
</body>
</html>
